name: Build BlockNew dylib

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: CheckoutB
        uses: actions/checkout@v4

      # ── 生成版本号 ──────────────────────────────────────────────────────────
      - name: Generate Version
        id: version
        run: |
          VERSION=v$(date +"%Y.%m.%d.%H%M%S")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Generated version: $VERSION"

      # ── 下载 fishhook（Facebook，用于 C 函数 hook，同时作为编译依赖）──────
      - name: Download fishhook
        run: |
          curl -fsSL -o fishhook.c https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c
          curl -fsSL -o fishhook.h https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h

      # ── 编译 arm64 + arm64e fat dylib ─────────────────────────────────────
      - name: Build dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          # arm64
          clang -dynamiclib \
            BlockNew.m fishhook.c \
            -isysroot "$SDK" \
            -arch arm64 \
            -miphoneos-version-min=13.0 \
            -framework Foundation \
            -fobjc-arc \
            -Wno-unused-function \
            -o BlockNew_arm64.dylib

          # arm64e（A12+ / iPhone XS 以上）
          clang -dynamiclib \
            BlockNew.m fishhook.c \
            -isysroot "$SDK" \
            -arch arm64e \
            -miphoneos-version-min=13.0 \
            -framework Foundation \
            -fobjc-arc \
            -Wno-unused-function \
            -o BlockNew_arm64e.dylib

          # 合并成 fat binary
          lipo -create BlockNew_arm64.dylib BlockNew_arm64e.dylib \
               -output BlockNew.dylib

          # 验证
          echo "=== lipo info ==="
          lipo -info BlockNew.dylib
          echo "=== file ==="
          file BlockNew.dylib

      # ── 创建 Release 并上传 ───────────────────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: |
            ## BlockNew ${{ env.VERSION }}

            屏蔽 `umeng.com` 和 `umengcloud.com` 的所有网络请求。

            ### 安装
            1. 下载 `BlockNew.dylib`
            2. 在 LiveContainer → **Tweaks** → `+` → **Import Tweak**
            3. 选择子文件夹或放根目录（全局生效）
            4. 在 App 设置中设置 **Tweak Folder**，启动即生效

            ### 验证
            在设备日志中搜索 `[BlockNew]`，看到 `✅ All hooks installed` 表示加载成功。
          files: BlockNew.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
